
name: Publish Terraform Module to Registry

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  validate:
    name: validate
    uses: ./.github/workflows/Validate-pr.yml 

  publish:
    name: Prepare and publish to Terraform Registry
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Validate tag format
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "$TAG" | grep -E '^v[0-9]+\\.[0-9]+\\.[0-9]+$' || (echo "Invalid tag format: $TAG" && exit 1)

      # Future step: Publish to Terraform Registry
